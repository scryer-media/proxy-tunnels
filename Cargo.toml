[package]
name = "proxy-tunnels"
version = "0.21.0"
edition = "2024"
description = "First-party SSH, userspace WireGuard and optional HTTP/3 tunnels for Scryer and Weaver"
license = "GPL-3.0-only"
repository = "https://github.com/scryer-media/proxy-tunnels"
readme = "README.md"
publish = false

[features]
default = []
# In-process SSH server double. Used by this crate's own tests and, through a
# dev-dependency, by the consumer-side tests in `scryer-application`,
# `scryer-plugins` and `scryer-infrastructure-acquisition` that prove their
# egress really travels through a tunnel. Never enabled in a product build.
test-support = []
http3 = ["dep:bytes", "dep:http", "dep:h3", "dep:h3-quinn", "dep:quinn", "dep:rustls", "dep:webpki-roots"]

[dependencies]
# The whole reason this crate exists: russh (and only russh) may depend on the
# SSH stack. `aws-lc-rs` is the workspace's existing crypto backend (rustls,
# sqlx and jsonwebtoken all use it), so no second backend enters the tree.
# Default features are off deliberately: that drops `flate2` (SSH-level
# compression, useless for proxied HTTPS) and `rsa` (which pulls an RSA
# release candidate). Ed25519 is the only accepted private-key type.
russh = { version = "0.63.1", default-features = false, features = ["aws-lc-rs"] }
# The WireGuard half. `gotatun` owns the protocol — handshakes, encryption,
# rekeying, keepalives, peers, timers — and the Tokio UDP transport; `smoltcp`
# owns IP/TCP/UDP/DNS above it. Neither ever touches an OS interface: the two
# meet in an in-memory `IpSend`/`IpRecv` adapter, so a tunnel needs no `tun`
# device, no routing table entry and no elevated privileges.
#
# `default-features = false` on gotatun exists to name `aws-lc-rs` explicitly
# rather than inherit it: that keeps the workspace on one crypto backend and
# keeps gotatun's `ring` backend disabled. `tun`, `daita`, `pcap` and
# `windows-gro` stay off.
#
# smoltcp is compiled down to exactly what a point-to-point tunnel needs:
# `medium-ip` (no Ethernet, so no ARP and no neighbour cache), both IP
# families, and the TCP/UDP/DNS sockets. `async` is what makes the Tokio
# wrappers real futures — smoltcp registers our task wakers on its sockets and
# wakes them from the stack pump, so nothing in this crate spins.
gotatun = { version = "0.9.2", default-features = false, features = ["aws-lc-rs", "device"] }
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-dns", "socket-tcp", "socket-udp", "socket-dns"] }
# gotatun's `Peer::allowed_ips` is `Vec<ipnetwork::IpNetwork>` and gotatun does
# not re-export the crate, so a peer cannot be built without naming it. Pinned
# to the version gotatun already resolves, so no second copy enters the tree.
ipnetwork = "0.21"
base64 = "0.22"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"

# Optional HTTP/3 CONNECT transport. Keep the existing AWS-LC backend;
# Quinn's default features would otherwise introduce ring.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
h3 = { version = "0.0.8", path = "vendor/h3", optional = true }
h3-quinn = { version = "0.0.10", path = "vendor/h3-quinn", optional = true }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "test-util"] }

[[example]]
name = "http3_interop"
required-features = ["http3"]
